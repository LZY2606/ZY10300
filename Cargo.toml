[package]
name = "parquet-dissect"
version = "0.1.0"
edition = "2021"
description = "Read-only Parquet dissection bench: footer, column chunks, pages, encodings, levels, lineage"

[dependencies]
anyhow = "1"
axum = "0.8"
crc32fast = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snap = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 2
