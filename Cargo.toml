[package]
name = "parquet-dissect"
version = "0.1.0"
edition = "2021"
description = "Read-only Parquet dissection workbench (页列解剖台)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snap = "1"
